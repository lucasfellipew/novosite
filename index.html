<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 50 Criptomoedas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background-color: #f8f9fa;
            --success-color: #2ecc71;
            --warning-color: #f1c40f;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--primary-color);
        }

        /* Estilos para o ticker de notícias */
        .news-ticker-container {
            background: var(--primary-color);
            color: white;
            padding: 10px 0;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
        }

        .news-ticker {
            display: flex;
            gap: 40px;
            animation: ticker 60s linear infinite;
            white-space: nowrap;
            padding: 0 20px;
        }

        .news-ticker:hover {
            animation-play-state: paused;
        }

        .news-item {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s;
        }

        .news-item:hover {
            color: var(--warning-color);
            transform: translateY(-2px);
        }

        .news-thumb {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            object-fit: cover;
        }

        .news-source {
            background: var(--secondary-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            white-space: nowrap;
        }

        .news-title {
            font-size: 0.95em;
            opacity: 0.9;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Estilos principais */
        .dashboard-container {
            padding: 20px;
            padding-top: 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            background: white;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .crypto-table {
            width: 100%;
        }

        .crypto-table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
            cursor: pointer;
        }

        .crypto-table th:hover {
            background-color: #f8f9fa;
        }

        .coin-image {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .buy-signal {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .buy-signal.strong {
            background-color: var(--success-color);
            color: white;
        }

        .buy-signal.neutral {
            background-color: var(--warning-color);
            color: black;
        }

        .buy-signal.weak {
            background-color: var(--danger-color);
            color: white;
        }

        .volume-bar {
            height: 5px;
            background: #ecf0f1;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .volume-bar-fill {
            height: 100%;
            background: var(--secondary-color);
            transition: width 0.3s ease;
        }

        .price-change-positive {
            color: var(--success-color);
        }

        .price-change-negative {
            color: var(--danger-color);
        }

        .refresh-button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .refresh-button:hover {
            background-color: #2980b9;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--secondary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos para o widget de swap */
        .swap-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .swap-widget-container.minimized {
            transform: translateY(calc(100% - 40px));
        }

        .swap-widget-header {
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .swap-widget-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .swap-widget-content {
            padding: 15px;
        }

        .swap-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .swap-input-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .swap-input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .swap-input-group select,
        .swap-input-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 5px;
        }

        .swap-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .swap-button:hover {
            background: #34495e;
        }

        @media (max-width: 768px) {
            .swap-widget-container {
                width: 100%;
                bottom: 0;
                right: 0;
                border-radius: 15px 15px 0 0;
            }
        }
    </style>
</head>
<body>
    <!-- Ticker de Notícias -->
    <div class="news-ticker-container">
        <div class="news-ticker" id="newsTicker">
            <!-- Notícias serão inseridas aqui via JavaScript -->
        </div>
    </div>

    <div class="dashboard-container">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h1>Top 50 Criptomoedas por Volume</h1>
                <button class="refresh-button" onclick="loadCryptoData()">
                    Atualizar Dados
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table crypto-table">
                        <thead>
                            <tr>
                                <th onclick="sortTable('market_cap_rank')">Ranking</th>
                                <th onclick="sortTable('name')">Nome</th>
                                <th onclick="sortTable('current_price')">Preço (USD)</th>
                                <th onclick="sortTable('price_change_percentage_24h')">Variação 24h</th>
                                <th onclick="sortTable('total_volume')">Volume 24h</th>
                                <th onclick="sortTable('signal')">Sinal de Compra</th>
                            </tr>
                        </thead>
                        <tbody id="cryptoTableBody">
                            <!-- Dados serão preenchidos via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Widget de Swap Simplificado -->
    <div id="swapWidget" class="swap-widget-container">
        <div class="swap-widget-header" onclick="toggleSwapWidget()">
            <h3>Swap de Criptomoedas</h3>
            <button class="swap-widget-toggle" id="swapToggleButton">−</button>
        </div>
        <div class="swap-widget-content">
            <form class="swap-form" onsubmit="handleSwap(event)">
                <div class="swap-input-group">
                    <label>De:</label>
                    <select id="fromCrypto" required>
                        <option value="">Selecione a moeda</option>
                    </select>
                    <input type="number" id="fromAmount" placeholder="Quantidade" required min="0" step="any">
                </div>
                
                <div class="swap-input-group">
                    <label>Para:</label>
                    <select id="toCrypto" required>
                        <option value="">Selecione a moeda</option>
                    </select>
                    <input type="number" id="toAmount" placeholder="Você receberá" readonly>
                </div>

                <button type="submit" class="swap-button">
                    Conectar Carteira para Trocar
                </button>
            </form>
        </div>
    </div>

    <script>
        let cryptoData = [];
        let currentSort = {
            column: 'market_cap_rank',
            direction: 'asc'
        };

        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function formatNumber(number, decimals = 2) {
            return new Intl.NumberFormat('pt-BR', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }).format(number);
        }

        function formatVolume(volume) {
            if (volume >= 1e9) {
                return `$${formatNumber(volume / 1e9)}B`;
            }
            if (volume >= 1e6) {
                return `$${formatNumber(volume / 1e6)}M`;
            }
            return `$${formatNumber(volume)}`;
        }

        function getBuySignal(priceChange24h, volume) {
            if (priceChange24h <= -10 && volume > 100000000) {
                return { signal: 'FORTE COMPRA', class: 'strong' };
            } else if (priceChange24h <= -5 && volume > 50000000) {
                return { signal: 'COMPRA MODERADA', class: 'neutral' };
            } else {
                return { signal: 'AGUARDAR', class: 'weak' };
            }
        }

        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            cryptoData.sort((a, b) => {
                let valueA = column === 'signal' ? 
                    getBuySignal(a.price_change_percentage_24h, a.total_volume).signal :
                    a[column];
                let valueB = column === 'signal' ? 
                    getBuySignal(b.price_change_percentage_24h, b.total_volume).signal :
                    b[column];

                if (valueA === null) return 1;
                if (valueB === null) return -1;

                if (typeof valueA === 'string') {
                    valueA = valueA.toLowerCase();
                    valueB = valueB.toLowerCase();
                }

                if (valueA < valueB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valueA > valueB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            updateTable();
            updateSwapOptions();
        }

        function updateTable() {
            const tableBody = document.getElementById('cryptoTableBody');
            const maxVolume = Math.max(...cryptoData.map(crypto => crypto.total_volume));

            tableBody.innerHTML = cryptoData.map(crypto => {
                const volumePercentage = (crypto.total_volume / maxVolume) * 100;
                const buySignal = getBuySignal(crypto.price_change_percentage_24h, crypto.total_volume);

                return `
                    <tr>
                        <td>${crypto.market_cap_rank}</td>
                        <td>
                            <img src="${crypto.image}" alt="${crypto.name}" class="coin-image">
                            <strong>${crypto.name}</strong>
                            <small class="text-muted">${crypto.symbol.toUpperCase()}</small>
                        </td>
                        <td>$${formatNumber(crypto.current_price, crypto.current_price < 1 ? 4 : 2)}</td>
                        <td class="${crypto.price_change_percentage_24h >= 0 ? 'price-change-positive' : 'price-change-negative'}">
                            ${crypto.price_change_percentage_24h >= 0 ? '+' : ''}${formatNumber(crypto.price_change_percentage_24h)}%
                        </td>
                        <td>
                            <div>${formatVolume(crypto.total_volume)}</div>
                            <div class="volume-bar">
                                <div class="volume-bar-fill" style="width: ${volumePercentage}%"></div>
                            </div>
                        </td>
                        <td>
                            <span class="buy-signal ${buySignal.class}">
                                ${buySignal.signal}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadNews() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/news?lang=pt');

                if (!response.ok) {
                    throw new Error('Erro ao carregar notícias');
                }

                const news = await response.json();
                const formattedNews = news.map(item => ({
                    title: item.title,
                    source: item.author,
                    url: item.url,
                    thumb: item.thumb_2x
                }));
                updateNewsTicker(formattedNews);
            } catch (error) {
                console.error('Erro ao carregar notícias:', error);
                const fallbackNews = [
                    {
                        title: "Bitcoin atinge nova máxima do ano",
                        source: "CriptoFácil",
                        url: "#",
                        thumb: ""
                    },
                    {
                        title: "Ethereum 2.0 se prepara para grande atualização",
                        source: "Portal do Bitcoin",
                        url: "#",
                        thumb: ""
                    },
                    {
                        title: "Binance anuncia novos produtos para o mercado brasileiro",
                        source: "Cointelegraph Brasil",
                        url: "#",
                        thumb: ""
                    }
                ];
                updateNewsTicker(fallbackNews);
            }
        }

        function updateNewsTicker(news) {
            const ticker = document.getElementById('newsTicker');
            const newsHtml = news.map(item => `
                <a href="${item.url}" target="_blank" class="news-item">
                    ${item.thumb ? `<img src="${item.thumb}" alt="" class="news-thumb">` : ''}
                    <span class="news-source">${item.source}</span>
                    <span class="news-title">${item.title}</span>
                </a>
            `).join('');
            
            ticker.innerHTML = newsHtml + newsHtml;
        }

        async function loadCryptoData() {
            showLoading();
            try {
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/coins/markets?' +
                    'vs_currency=usd' +
                    '&order=volume_desc' +
                    '&per_page=50' +
                    '&page=1' +
                    '&sparkline=false' +
                    '&price_change_percentage=24h'
                );
                
                if (!response.ok) {
                    throw new Error('Erro ao carregar dados');
                }

                cryptoData = await response.json();
                sortTable(currentSort.column);
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar dados. Tente novamente mais tarde.');
            } finally {
                hideLoading();
            }
        }

        function toggleSwapWidget() {
            const widget = document.getElementById('swapWidget');
            const toggleButton = document.getElementById('swapToggleButton');
            widget.classList.toggle('minimized');
            toggleButton.textContent = widget.classList.contains('minimized') ? '+' : '−';
        }

        function updateSwapOptions() {
            const fromSelect = document.getElementById('fromCrypto');
            const toSelect = document.getElementById('toCrypto');
            
            fromSelect.innerHTML = '<option value="">Selecione a moeda</option>';
            toSelect.innerHTML = '<option value="">Selecione a moeda</option>';
            
            cryptoData.forEach(crypto => {
                const option = `<option value="${crypto.id}" data-price="${crypto.current_price}">${crypto.name} (${crypto.symbol.toUpperCase()})</option>`;
                fromSelect.innerHTML += option;
                toSelect.innerHTML += option;
            });
        }

        function calculateSwapAmount() {
            const fromSelect = document.getElementById('fromCrypto');
            const toSelect = document.getElementById('toCrypto');
            const fromAmount = document.getElementById('fromAmount');
            const toAmount = document.getElementById('toAmount');

            if (fromSelect.value && toSelect.value && fromAmount.value) {
                const fromPrice = parseFloat(fromSelect.selectedOptions[0].dataset.price);
                const toPrice = parseFloat(toSelect.selectedOptions[0].dataset.price);
                const amount = parseFloat(fromAmount.value);

                const estimatedAmount = (amount * fromPrice) / toPrice;
                toAmount.value = estimatedAmount.toFixed(8);
            }
        }

        function handleSwap(event) {
            event.preventDefault();
            alert('Para realizar o swap, você precisa conectar sua carteira Web3 (MetaMask, Trust Wallet, etc.)');
        }

        // Event Listeners
        document.getElementById('fromCrypto').addEventListener('change', calculateSwapAmount);
        document.getElementById('toCrypto').addEventListener('change', calculateSwapAmount);
        document.getElementById('fromAmount').addEventListener('input', calculateSwapAmount);

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadCryptoData();
            loadNews();
            // Atualizar dados a cada 5 minutos
            setInterval(loadCryptoData, 300000);
            // Atualizar notícias a cada 10 minutos
            setInterval(loadNews, 600000);
        });
    </script>
</body>
</html>
